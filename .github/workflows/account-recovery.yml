name: E2E Account Recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed E2E workflow run ID containing the account manifest
        required: true
        type: string
      source_run_attempt:
        description: Attempt number for the failed E2E workflow run
        required: true
        type: string
      writer_window_token:
        description: Manager-recorded frozen Beta E2E recovery writer window token
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: beta-e2e-account-pool
  cancel-in-progress: false

jobs:
  recover:
    name: Recover exact E2E identities and owned resources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      E2E_STAGE: beta
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      E2E_SERVICE_URL: ${{ vars.BETA_SERVICE_URL }}
      E2E_ACCOUNT_BUDGET_PATH: recovery/account-budget.json
      E2E_SERVICE_CLEANUP_EVIDENCE_PATH: recovery/service-cleanup-run.json
      ENABLE_INFRA_E2E: ${{ vars.ENABLE_INFRA_E2E }}
      E2E_WRITER_WINDOW_TOKEN: ${{ inputs.writer_window_token }}
      E2E_EXPECTED_WRITER_WINDOW_TOKEN: ${{ vars.E2E_WRITER_WINDOW_TOKEN }}
      E2E_WRITER_SHA: ${{ vars.E2E_WRITER_SHA }}
      E2E_WRITER_RUN_ID: ${{ vars.E2E_WRITER_RUN_ID }}
      E2E_WRITER_RUN_ATTEMPT: ${{ vars.E2E_WRITER_RUN_ATTEMPT }}
      E2E_WRITER_EXPIRES_AT: ${{ vars.E2E_WRITER_EXPIRES_AT }}
      E2E_WRITER_RECORD_URL: ${{ vars.E2E_WRITER_RECORD_URL }}
      E2E_CLEANUP_SERVICE_SHA: ${{ vars.E2E_CLEANUP_SERVICE_SHA }}

    steps:
      - name: Checkout E2E recovery tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile

      - name: Require reviewed compatibility and recovery writer window
        run: |
          node scripts/check-compatibility.mjs --require-infra
          node scripts/writer-window.mjs

      - name: Generate Service cleanup token
        id: service-cleanup-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AnyWear-Service
          permission-actions: write

      - name: Configure Beta AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/beta-e2e-qualification-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify exact original E2E owner/artifact and prepare captured workers
        id: recovery-scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RECOVERY_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: node scripts/account-recovery-inputs.mjs

      - name: Load deployed identity configuration
        shell: bash
        run: |
          pool_id=$(aws ssm get-parameter --name /anywear/beta/cognito_user_pool_id --query Parameter.Value --output text)
          echo "USER_POOL_ID=$pool_id" >> "$GITHUB_ENV"

      - name: Recover exact worker data and identities through the reviewed Service operator
        env:
          GH_TOKEN: ${{ steps.service-cleanup-token.outputs.token }}
          E2E_ACCOUNT_RUN_SCOPE: ${{ steps.recovery-scope.outputs.run_scope }}
          E2E_WORKERS: ${{ steps.recovery-scope.outputs.max_active }}
          E2E_MAX_ACTIVE_ACCOUNTS: ${{ steps.recovery-scope.outputs.max_active }}
          E2E_MAX_NEW_ACCOUNTS_PER_RUN: ${{ steps.recovery-scope.outputs.max_new }}
          E2E_MAX_QUARANTINED_ACCOUNTS: ${{ steps.recovery-scope.outputs.max_quarantined }}
        run: |
          node scripts/writer-window.mjs
          pnpm accounts:cleanup-workers

      - name: Reject remaining unknown or unrecovered accounts
        run: jq -e 'all(.accounts[]; .status == "deleted")' recovery/account-budget.json >/dev/null

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-account-recovery-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: |
            recovery/account-budget.json
            recovery/service-cleanup-run.json
            recovery/original-account-budget.json
            recovery/original-service-cleanup-run.json
            recovery/original-owner.json
          if-no-files-found: ignore
