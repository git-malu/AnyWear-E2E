name: Beta Qualification

# The E2E deployable unit's single manual entry (#163): the `qualify` entry. One protected
# dispatch surface carries three operations — `full` (release qualification), `smoke`
# (deployed diagnostic) and `reconcile` (automatic leftover expiry) — and since #180 it is
# also dispatched by another workflow: a deployment smoke hook
# (`trigger=deploy-smoke`), the release action (`trigger=release-qualify`) and, since #217,
# the daily account-reconcile schedule (`trigger=scheduled`).
#
# #217: leftover data is bounded by time, not quarantined, and the manual `recover` exit is
# removed. The `reconcile` job runs before every qualification suite and as its own
# dispatched operation. It reads the previous seven
# days' `beta-account-lifecycle-*` / `beta-smoke-account-lifecycle-*` manifests and the
# CloudTrail `AdminCreateUser` history, replays the exact-reference Service cleanup, deletes
# the identity by its immutable username, reads absence back, and writes an
# `anywear_e2e_account_reconcile` v1 record. A teardown that cannot prove deletion records
# its identity `retained` with a `reconcileBy` bound and still fails its own run.
#
# #180: qualification no longer reads a committed compatibility file. It reads the live
# deployed tuple (Client `build-metadata.json`, Service `/health`), compares it with the
# dispatch expectation, verifies the live Service commit resolves to an immutable Service
# release, takes its own authenticated platform observation, runs the suite, re-observes
# and writes qualification record v3. The credential-free preflight performs the live
# identity, supported-Client floor and immutable-release checks before any credential job;
# `full` repeats them before it assumes AWS credentials and records the release identity
# it verified.
#
# Separation between the three outcomes lives in the signed `operation` field, not in a
# workflow-file boundary. Only the `full` job can produce `qualification-record.json`; the
# `record` job validates and attaches it without a credential and is the last qualification
# job. A `smoke` or `reconcile` run can therefore neither produce nor withhold a
# qualification record, and a green `full` run whose record `record` has verified and
# attached completes the release decision: the audit trail is the `qualify` dispatch event
# (actor and time), the E2E `full` run/attempt and the sealed v3 record tuple, not a
# separate approval action. There is no approval Environment.
# `execution-guard.mjs` maps each operation to this one entry and refuses an operation
# that was not stated explicitly.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Qualification operation: full (release gate), smoke (diagnostic) or reconcile (leftover expiry)'
        required: true
        type: choice
        options: [full, smoke, reconcile]
      expected_service_commit:
        # #180: supplied by the release action (release-qualify) or by an operator who
        # re-runs a qualification. Only `full` compares it with the live Service commit,
        # and every other operation refuses it in the preflight.
        description: Expected live Service commit (40-hex); optional, and only operation full accepts it
        required: false
        type: string
      expected_client_commit:
        description: Expected live Client source commit (40-hex); optional, and only operation full accepts it
        required: false
        type: string
      trigger:
        # The trigger is evidence, not a permission: the preflight validates the exact
        # combination with the operation and the dispatch inputs, and the record states it.
        description: 'Qualification trigger: manual, deploy-smoke (smoke only), release-qualify (full only) or scheduled (reconcile only)'
        required: false
        default: manual
        type: choice
        options: [manual, deploy-smoke, release-qualify, scheduled]
      dispatched_by:
        description: URL of the run that dispatched this qualification; only accepted for a non-manual trigger
        required: false
        type: string
      worker_slot_offset:
        description: First captured worker slot (each operation allocates two; choose unused slots)
        required: false
        default: 0
        type: number
      reconcile_lookback_days:
        # #217: 7 is the ordinary lookback. 90 is the one recorded migration dispatch, which
        # reads the whole artifact retention and must precede the removals; only the reconcile
        # operation accepts it, and the preflight refuses any other value.
        description: 'Reconcile lookback in whole days: 7 (ordinary) or 90 (one migration dispatch); only operation reconcile accepts it'
        required: false
        type: choice
        options: ['7', '90']
        default: '7'

permissions:
  contents: read

# The single protected deployment account. These are workflow constants, not
# environment-scoped repository variables: the environment-free `preflight` and its
# execution guard resolve the account and region before any job enters the `beta`
# environment. No job may shadow them, and environment-only values stay in the jobs that
# declare `environment: beta`.
#
# #180: the two public Beta endpoints are workflow constants for the same reason. The
# preflight must read the live tuple before any credential job, and a job without
# `environment: beta` cannot resolve the environment-scoped BETA_CLIENT_URL and
# BETA_SERVICE_URL. Every job consumes these constants, so the preflight comparison, the
# suite and the record all name the same endpoints. They are the current `beta`
# environment values; if a CloudFront distribution is ever recreated, these constants
# move with it in the same reviewed change (the environment-scoped copies are otherwise
# unused, and moving them is an owner setting action, not part of a dispatch).
env:
  AWS_ACCOUNT_ID: '650880818323'
  AWS_REGION: 'ap-east-1'
  E2E_CLIENT_URL: 'https://d2rztl7o0y7rf8.cloudfront.net'
  E2E_SERVICE_URL: 'https://d1pfqujqt29n11.cloudfront.net'

concurrency:
  group: beta-e2e-account-pool
  cancel-in-progress: false

jobs:
  # The gate that runs before any credential job. It holds no AWS credentials, declares no
  # environment, and verifies the source, the operation/trigger combination, and the live
  # deployed tuple — identity against the dispatch expectation, supported-Client floor and
  # the immutable Service release — through the read-only Service App token. Every
  # credential job `needs` it.
  preflight:
    name: Verify the protected qualification source and live tuple
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      # The gate that authorizes the credential jobs is the gate that validated the
      # operation: the operation jobs read this output, not the raw dispatch input.
      operation: ${{ steps.operation-scope.outputs.operation }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      E2E_STAGE: beta
      E2E_OPERATION: ${{ inputs.operation }}
      E2E_EXTERNAL_SERVERS: true
      ENABLE_BETA_MUTATION: ${{ vars.ENABLE_BETA_MUTATION }}
      E2E_CLEANUP_SERVICE_SHA: ${{ vars.E2E_CLEANUP_SERVICE_SHA }}

    steps:
      - name: Checkout E2E sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The entry is one dispatch surface, so the operation and the inputs that belong to
      # another operation are refused here rather than by file presence. The expected commits
      # are accepted only by `full`; and the trigger fixes which operation and inputs it
      # may accompany (#180).
      - name: Validate the dispatch operation, trigger and input scope
        id: operation-scope
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          TRIGGER: ${{ inputs.trigger }}
          EXPECTED_SERVICE_COMMIT: ${{ inputs.expected_service_commit }}
          EXPECTED_CLIENT_COMMIT: ${{ inputs.expected_client_commit }}
          DISPATCHED_BY: ${{ inputs.dispatched_by }}
          WORKER_SLOT_OFFSET: ${{ inputs.worker_slot_offset }}
          RECONCILE_LOOKBACK_DAYS: ${{ inputs.reconcile_lookback_days }}
        run: |
          case "$OPERATION" in
            full|smoke|reconcile) ;;
            *) echo "::error::Unknown qualification operation '$OPERATION'"; exit 1 ;;
          esac
          # #217: the reconcile operation owns no worker slot, so a slot offset on it is a
          # dispatch mistake rather than an allocation.
          if [[ "$OPERATION" == reconcile && "$WORKER_SLOT_OFFSET" != 0 ]]; then
            echo "::error::operation reconcile accepts no worker_slot_offset (got '$WORKER_SLOT_OFFSET')"
            exit 1
          fi
          # #217: the lookback is a closed set. 90 is the one migration dispatch over the
          # artifact retention, and only the reconcile operation accepts it; 7 is the ordinary
          # window every operation and trigger uses.
          case "$RECONCILE_LOOKBACK_DAYS" in
            7|90) ;;
            *) echo "::error::reconcile_lookback_days must be 7 or 90 (got '$RECONCILE_LOOKBACK_DAYS')"; exit 1 ;;
          esac
          if [[ "$OPERATION" != reconcile && "$RECONCILE_LOOKBACK_DAYS" != 7 ]]; then
            echo "::error::reconcile_lookback_days is only accepted by operation reconcile"
            exit 1
          fi
          # #180: the dispatch trigger is a closed combination with the operation, the
          # expected commits, the worker slot offset and the dispatching run URL.
          case "$TRIGGER" in
            manual)
              if [[ -n "$DISPATCHED_BY" ]]; then
                echo "::error::dispatched_by is only accepted for a non-manual trigger"
                exit 1
              fi
              ;;
            deploy-smoke)
              if [[ "$OPERATION" != smoke ]]; then
                echo "::error::trigger deploy-smoke requires operation smoke (got '$OPERATION')"
                exit 1
              fi
              if [[ -n "$EXPECTED_SERVICE_COMMIT$EXPECTED_CLIENT_COMMIT" ]]; then
                echo "::error::trigger deploy-smoke accepts no expected commits; the deployment smoke hook names none"
                exit 1
              fi
              if [[ "$WORKER_SLOT_OFFSET" != 0 ]]; then
                echo "::error::trigger deploy-smoke requires worker_slot_offset 0 (got '$WORKER_SLOT_OFFSET')"
                exit 1
              fi
              ;;
            release-qualify)
              if [[ "$OPERATION" != full ]]; then
                echo "::error::trigger release-qualify requires operation full (got '$OPERATION')"
                exit 1
              fi
              if [[ -z "$EXPECTED_SERVICE_COMMIT" ]]; then
                echo "::error::trigger release-qualify requires expected_service_commit"
                exit 1
              fi
              if [[ "$WORKER_SLOT_OFFSET" != 0 ]]; then
                echo "::error::trigger release-qualify requires worker_slot_offset 0 (got '$WORKER_SLOT_OFFSET')"
                exit 1
              fi
              ;;
            scheduled)
              # #217: the daily account-reconcile schedule dispatches this entry, because the
              # execution guard requires `workflow_dispatch` and a `schedule` event would fail
              # closed. It may only ask for the reconcile operation.
              if [[ "$OPERATION" != reconcile ]]; then
                echo "::error::trigger scheduled requires operation reconcile (got '$OPERATION')"
                exit 1
              fi
              if [[ "$WORKER_SLOT_OFFSET" != 0 ]]; then
                echo "::error::trigger scheduled requires worker_slot_offset 0 (got '$WORKER_SLOT_OFFSET')"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown qualification trigger '$TRIGGER'"
              exit 1
              ;;
          esac
          if [[ "$TRIGGER" != manual ]]; then
            if [[ ! "$DISPATCHED_BY" =~ ^https://[^[:space:]]+$ ]]; then
              echo "::error::trigger $TRIGGER requires dispatched_by as an HTTPS URL (got '$DISPATCHED_BY')"
              exit 1
            fi
          fi
          # Both expected commits are optional, and only the release-gating operation may
          # compare them with the live deployment.
          if [[ "$OPERATION" != full ]]; then
            for name in EXPECTED_SERVICE_COMMIT EXPECTED_CLIENT_COMMIT; do
              if [[ -n "${!name}" ]]; then
                echo "::error::$name is only accepted by operation full"
                exit 1
              fi
            done
          fi
          for name in EXPECTED_SERVICE_COMMIT EXPECTED_CLIENT_COMMIT; do
            if [[ -n "${!name}" && ! "${!name}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$name must be a full lowercase 40-character commit SHA"
              exit 1
            fi
          done
          # Publish the validated operation. The credential jobs gate on this output, so the
          # job that authorizes them is the job that checked the operation and its inputs.
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"

      - name: Check E2E source
        run: pnpm check

      - name: Require protected execution
        run: node scripts/execution-guard.mjs --source-only

      # The live identity, the supported-Client floor and the immutable Service release are
      # verified here, before any job holds a credential. The check reads only the two
      # public Beta endpoints and the GitHub API.
      - name: Generate Service artifact read token
        id: service-artifact-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AnyWear-Service
          permission-contents: read

      - name: Verify the live deployed tuple, supported-Client floor and immutable Service release
        env:
          SERVICE_ARTIFACT_READ_TOKEN: ${{ steps.service-artifact-token.outputs.token }}
          GH_TOKEN: ${{ steps.service-artifact-token.outputs.token }}
          OPERATION: ${{ steps.operation-scope.outputs.operation }}
          EXPECTED_SERVICE_COMMIT: ${{ inputs.expected_service_commit }}
          EXPECTED_CLIENT_COMMIT: ${{ inputs.expected_client_commit }}
        shell: bash
        run: |
          args=(--operation "$OPERATION" --client-url "$E2E_CLIENT_URL" --service-url "$E2E_SERVICE_URL")
          if [[ -n "$EXPECTED_SERVICE_COMMIT" ]]; then args+=(--expected-service-commit "$EXPECTED_SERVICE_COMMIT"); fi
          if [[ -n "$EXPECTED_CLIENT_COMMIT" ]]; then args+=(--expected-client-commit "$EXPECTED_CLIENT_COMMIT"); fi
          node scripts/service-release.mjs "${args[@]}"
          if [[ "$OPERATION" == full || "$OPERATION" == smoke ]]; then
            {
              echo "### Live Beta tuple"
              echo
              echo "- Client: \`$(jq -r '.client.source_commit' .qualification-inputs/live-identity.json)\` (version $(jq -r '.client.client_version' .qualification-inputs/live-identity.json))"
              echo "- Service: \`$(jq -r '.service.service_commit' .qualification-inputs/live-identity.json)\`"
              echo "- Image: \`$(jq -r '.service.image_digest' .qualification-inputs/live-identity.json)\`"
              echo "- Minimum Client: $(jq -r '.service.minimum_client_version' .qualification-inputs/live-identity.json)"
              echo "- Service release: \`$(jq -r '.tag' .qualification-inputs/service-release.json)\` (target $(jq -r '.target_commit' .qualification-inputs/service-release.json), $(jq -r '.assets | length' .qualification-inputs/service-release.json) released assets)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # #217: automatic leftover expiry. It runs before every qualification suite and as its own
  # dispatched operation, so a qualification starts from a reconciled environment and no
  # leftover waits for an operator. It reads the run-bound lifecycle artifacts of the lookback
  # and the CloudTrail `AdminCreateUser` history, attributes every identity to the run that
  # created it (the credential session names it), replays the exact-reference Service cleanup,
  # deletes each identity by its immutable username, reads absence back, and writes the
  # `anywear_e2e_account_reconcile` v1 record. The job is bounded to 15 minutes and fails
  # closed without deleting when a source is unavailable. The one migration dispatch over the
  # 90-day artifact retention is bounded to 30 minutes and states the window it read.
  reconcile:
    name: Reconcile retained E2E identities and objects
    needs: preflight
    if: github.ref == 'refs/heads/main' && (needs.preflight.outputs.operation == 'reconcile' || needs.preflight.outputs.operation == 'full' || needs.preflight.outputs.operation == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.operation == 'reconcile' && inputs.reconcile_lookback_days == '90' && 30 || 15 }}
    environment: beta
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      E2E_STAGE: beta
      E2E_OPERATION: ${{ inputs.operation }}
      ENABLE_BETA_MUTATION: ${{ vars.ENABLE_BETA_MUTATION }}
      E2E_CLEANUP_SERVICE_SHA: ${{ vars.E2E_CLEANUP_SERVICE_SHA }}
      BETA_CLEANUP_STATE_MACHINE_VERSION_ARN: ${{ vars.BETA_CLEANUP_STATE_MACHINE_VERSION_ARN }}
      # The reviewed lookback and the job's own deadline. An ordinary reconcile stops starting
      # work at 720 seconds inside a 15-minute job; the one migration dispatch stops at 1500
      # seconds inside a 30-minute job, and the remaining deadline is passed into every cleanup
      # wait so no wait outlives the job and loses the record.
      E2E_ACCOUNT_RECONCILE_LOOKBACK_DAYS: ${{ inputs.reconcile_lookback_days }}
      E2E_ACCOUNT_RECONCILE_DEADLINE_SECONDS: ${{ inputs.reconcile_lookback_days == '90' && '1500' || '720' }}
      E2E_ACCOUNT_RECONCILE_DIRECTORY: reconcile
      E2E_ACCOUNT_RECONCILE_RECORD_PATH: reconcile/account-reconcile.json

    steps:
      - name: Checkout E2E sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile

      # The source gate ran in the credential-free preflight; this job only re-proves that
      # it is the protected source before it holds a credential.
      - name: Require protected execution
        run: node scripts/execution-guard.mjs --source-only

      - name: Configure Beta AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/beta-e2e-qualification-role
          role-session-name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify dedicated E2E principal
        shell: bash
        run: |
          identity=$(aws sts get-caller-identity --output json)
          account=$(jq -r '.Account' <<< "$identity")
          principal=$(jq -r '.Arn' <<< "$identity")
          [[ "$account" == 650880818323 ]]
          [[ "$principal" == "arn:aws:sts::650880818323:assumed-role/beta-e2e-qualification-role/e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
          echo "E2E_AWS_ACCOUNT=$account" >> "$GITHUB_ENV"
          echo "E2E_AWS_PRINCIPAL_ARN=$principal" >> "$GITHUB_ENV"

      # The cleanup envelope must name the Service release the cleanup capability was
      # deployed with, so the live tuple supplies the source/image pair. A qualification run
      # has already observed it; this job reads it once for its own envelope.
      - name: Load the Beta pool and the live cleanup identity
        env:
          QUALIFICATION_EVIDENCE_PATH: reconcile/deployment-evidence.json
        run: |
          mkdir -p reconcile
          pool_id=$(aws ssm get-parameter --name /anywear/beta/cognito_user_pool_id --query Parameter.Value --output text)
          pnpm qualification:collect
          {
            echo "USER_POOL_ID=$pool_id"
            echo "E2E_CLEANUP_SERVICE_SOURCE_SHA=$(jq -r '.service.service_commit' reconcile/deployment-evidence.json)"
            echo "E2E_CLEANUP_SERVICE_IMAGE_DIGEST=$(jq -r '.service.image_digest' reconcile/deployment-evidence.json)"
          } >> "$GITHUB_ENV"

      - name: Reconcile recent E2E leftover identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/execution-guard.mjs
          node scripts/reconcile-accounts.mjs

      - name: Upload the reconcile record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-account-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reconcile/account-reconcile.json
            reconcile/deployment-evidence.json
            reconcile/service-cleanup-*.json
          retention-days: 90
          if-no-files-found: ignore

  # The only job that may produce `qualification-record.json`. It carries the deployed
  # release-gating suite of the former Beta Qualification workflow. The record path binds
  # the dispatched operation and refuses anything but `full`.
  full:
    name: Qualify the live deployed tuple on Beta
    needs: [preflight, reconcile]
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.operation == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: beta
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      E2E_STAGE: beta
      E2E_OPERATION: ${{ inputs.operation }}
      E2E_EXTERNAL_SERVERS: true
      ENABLE_BETA_MUTATION: ${{ vars.ENABLE_BETA_MUTATION }}
      E2E_CLEANUP_SERVICE_SHA: ${{ vars.E2E_CLEANUP_SERVICE_SHA }}
      BETA_CLEANUP_STATE_MACHINE_VERSION_ARN: ${{ vars.BETA_CLEANUP_STATE_MACHINE_VERSION_ARN }}
      CLEANUP_MACHINE_AUTH_SECRET: ${{ secrets.CLEANUP_MACHINE_AUTH_SECRET }}
      E2E_WORKERS: 2
      E2E_WORKER_SLOT_OFFSET: ${{ inputs.worker_slot_offset }}
      E2E_MAX_ACTIVE_ACCOUNTS: 2
      # One lease per attempt: 2 workers x 3 attempts (initial + two CI retries).
      E2E_MAX_NEW_ACCOUNTS_PER_RUN: 6
      # The run's own Playwright JSON report. The qualification record's `test` member is
      # derived from these bytes — the selection, the report digest and one outcome per
      # selected spec — and both artifact lists below retain the report, so the digest the
      # record states can be audited against the report it names.
      E2E_QUALIFICATION_REPORT: test-results/qualification-report.json

    steps:
      - name: Checkout E2E sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check E2E source
        run: pnpm check

      - name: Require protected execution
        run: node scripts/execution-guard.mjs --source-only

      - name: Generate Service artifact read token
        id: service-artifact-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AnyWear-Service
          permission-contents: read

      # #180: the credential-free gate is repeated here, in the job that writes the record,
      # before it assumes any AWS credential. It compares the live identity with the
      # dispatch expectation, enforces the supported-Client floor, verifies the immutable
      # Service release and writes the two files the record is built from (live identity and
      # release identity). The preflight already ran the same check; this run is what the
      # record can name, and it fails before the suite starts.
      - name: Verify the live deployed tuple and the immutable Service release
        env:
          SERVICE_ARTIFACT_READ_TOKEN: ${{ steps.service-artifact-token.outputs.token }}
          GH_TOKEN: ${{ steps.service-artifact-token.outputs.token }}
          EXPECTED_SERVICE_COMMIT: ${{ inputs.expected_service_commit }}
          EXPECTED_CLIENT_COMMIT: ${{ inputs.expected_client_commit }}
        shell: bash
        run: |
          args=(--operation full --client-url "$E2E_CLIENT_URL" --service-url "$E2E_SERVICE_URL")
          if [[ -n "$EXPECTED_SERVICE_COMMIT" ]]; then args+=(--expected-service-commit "$EXPECTED_SERVICE_COMMIT"); fi
          if [[ -n "$EXPECTED_CLIENT_COMMIT" ]]; then args+=(--expected-client-commit "$EXPECTED_CLIENT_COMMIT"); fi
          node scripts/service-release.mjs "${args[@]}"

      - name: Configure Beta AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/beta-e2e-qualification-role
          role-session-name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify dedicated E2E principal
        shell: bash
        run: |
          identity=$(aws sts get-caller-identity --output json)
          account=$(jq -r '.Account' <<< "$identity")
          principal=$(jq -r '.Arn' <<< "$identity")
          [[ "$account" == 650880818323 ]]
          [[ "$principal" == "arn:aws:sts::650880818323:assumed-role/beta-e2e-qualification-role/e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
          echo "E2E_AWS_ACCOUNT=$account" >> "$GITHUB_ENV"
          echo "E2E_AWS_PRINCIPAL_ARN=$principal" >> "$GITHUB_ENV"

      - name: Require Beta admission eligibility
        run: node scripts/beta-admission-eligibility.mjs

      - name: Observe authenticated deployed tuple before suite
        env:
          QUALIFICATION_EVIDENCE_PATH: deployment-evidence-before.json
        run: pnpm qualification:collect

      # #228: the consumer-side drift gate. The deployment's smoke run observed the same
      # platform; this step finds the newest deploy-smoke observation of this release
      # among the 30 newest completed-success `workflow_dispatch` runs (the
      # `tested-revisions-<run>-<attempt>` artifact), compares `{client, service,
      # platform}` member by member, and refuses before the suite when a member differs
      # or when no matching smoke observation exists. The compared smoke run is recorded
      # in `.qualification-inputs/smoke-drift.json`, which the credential-free `record`
      # job re-verifies against exactly the recorded artifact. Only `full` runs this
      # gate; `smoke` and `reconcile` never do.
      - name: Verify the deploy-smoke observation agrees with the qualification observation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_DRIFT_BASELINE: deployment-evidence-before.json
        run: node scripts/verify-smoke-drift.mjs

      - name: Load Beta test identity configuration
        shell: bash
        run: |
          pool_id=$(aws ssm get-parameter --name /anywear/beta/cognito_user_pool_id --query Parameter.Value --output text)
          client_id=$(aws ssm get-parameter --name /anywear/beta/cognito_client_id --query Parameter.Value --output text)
          {
            echo "USER_POOL_ID=$pool_id"
            echo "VITE_COGNITO_USER_POOL_ID=$pool_id"
            echo "VITE_COGNITO_CLIENT_ID=$client_id"
            echo "E2E_CLEANUP_SERVICE_IMAGE_DIGEST=$(jq -r '.service.image_digest' deployment-evidence-before.json)"
            echo "E2E_CLEANUP_SERVICE_SOURCE_SHA=$(jq -r '.service.service_commit' deployment-evidence-before.json)"
          } >> "$GITHUB_ENV"

      - name: Set unique cleanup run scope
        shell: bash
        run: |
          run_scope="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 8)"
          echo "E2E_CLEANUP_RUN_SCOPE=$run_scope" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      # Captured immediately before the suite for every qualification run: a deployment
      # change cannot qualify a release, so which workers were serving Beta at suite start
      # belongs in every run's evidence. A capture that cannot be taken fails here rather
      # than letting the run proceed without the ability to attribute its own outcome.
      - name: Capture Beta worker identity before the suite
        run: node scripts/qualification-environment.mjs capture --phase before

      - name: Run the release-gating business regression suite
        id: beta-suite
        run: |
          node scripts/execution-guard.mjs
          pnpm test

      - name: Capture Beta worker identity after the suite
        # Runs even when the suite failed: a run that was replaced underneath must
        # still be able to say so. Placed before the worker cleanup so the window it
        # brackets stays the suite itself.
        if: ${{ always() }}
        run: node scripts/qualification-environment.mjs capture --phase after

      - name: Clean up exact Beta worker identities
        if: ${{ always() && steps.beta-suite.outcome != 'skipped' }}
        run: |
          node scripts/execution-guard.mjs
          pnpm accounts:cleanup-workers

      - name: Attribute the suite outcome to the product or the Beta environment
        # The verdict is evidence, and the step below reports whatever it concluded: it
        # attributes the run's outcome to the product or to the environment in its own
        # artifact, and never turns a failed run green. A cancelled or timed-out suite is
        # `incomplete`, which asserts no product failure because none was established.
        # The verdict is also a qualification gate on the passing path: a suite that
        # passed while the worker task definition changed refuses the qualification, while
        # a rotation of task ARNs on one unchanged definition is still recorded only.
        id: environment
        if: ${{ always() }}
        env:
          SUITE_OUTCOME: ${{ steps.beta-suite.outcome == 'success' && 'success' || (steps.beta-suite.outcome == 'failure' && 'failure' || 'incomplete') }}
        run: node scripts/qualification-environment.mjs verdict --suite-outcome "$SUITE_OUTCOME"

      - name: Refuse a qualification measured across two worker definitions
        # The blocking half of the policy: a suite measured across two worker task
        # definitions measured neither of them, so its pass cannot become a
        # qualification record. An ARN rotation alone still records and still
        # qualifies, because the configuration under test did not change.
        if: ${{ always() && steps.beta-suite.outcome == 'success' }}
        run: node scripts/qualification-environment.mjs qualification-gate

      - name: Preserve Beta suite failure
        if: ${{ always() && steps.beta-suite.outcome == 'failure' }}
        env:
          ENVIRONMENT_VERDICT: ${{ steps.environment.outputs.verdict }}
          ENVIRONMENT_REASON: ${{ steps.environment.outputs.reason }}
        run: |
          if [[ "$ENVIRONMENT_VERDICT" == "environment-changed" ]]; then
            echo "::error title=Environment changed during the suite::${ENVIRONMENT_REASON}"
            {
              echo "### Environment changed during the Beta suite"
              echo
              echo "${ENVIRONMENT_REASON}"
              echo
              echo "No product failure is asserted for this run. The qualification cannot"
              echo "be issued from a window the platform was redeployed under; re-run it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      # The reviewed Client floor this release qualifies against. The deployed Service
      # enforces it on every non-exempt request, and the rejection-contract scenario inside
      # the release-gating suite proves it: below-floor, headerless and malformed requests
      # are refused with CLIENT_VERSION_UNSUPPORTED, a request at the floor is admitted, and
      # `/health` stays exempt. `minimum-supported-client.json` states that reviewed floor
      # version only; the oldest-Client build that used to be checked out from a `sha` is
      # deleted with its leg. This is the workflow's only literal mention of the manifest, so
      # the floor the run is about to qualify against is stated on the run itself.
      - name: Read the minimum supported Client floor
        shell: bash
        run: |
          minimum_supported_client_version="$(jq -r '.version // empty' minimum-supported-client.json)"
          if [[ ! "$minimum_supported_client_version" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::minimum-supported-client.json version must be a non-negative integer"
            exit 1
          fi
          echo "Committed floor: $minimum_supported_client_version"

      - name: Confirm deployed identities remained stable
        env:
          QUALIFICATION_BASELINE_PATH: deployment-evidence-before.json
        run: pnpm qualification:collect

      - name: Create and verify qualification record
        env:
          QUALIFICATION_RESULT: passed
          # #180: the dispatch expectation and its source. A supplied Service commit is
          # compared with the live deployment and recorded as `source: trigger`; a manual
          # full without one records the live Service commit observed at run start as
          # `source: live`. The trigger and the dispatching run (when there is one) are
          # part of the record's `workflow` member.
          EXPECTED_SERVICE_COMMIT: ${{ inputs.expected_service_commit }}
          EXPECTED_CLIENT_COMMIT: ${{ inputs.expected_client_commit }}
          EXPECTED_SOURCE: ${{ inputs.expected_service_commit != '' && 'trigger' || 'live' }}
          QUALIFICATION_TRIGGER: ${{ inputs.trigger }}
          QUALIFICATION_DISPATCHED_BY: ${{ inputs.dispatched_by }}
        run: |
          pnpm qualification:generate
          pnpm qualification:verify

      # Handoff to the credential-free `record` job, which independently verifies the
      # record and uploads the artifact a release consumer reads. The final artifact is
      # not uploaded here: only `record` attaches it, and its name is the one
      # `verifyQualificationForPromotion` accepts.
      - name: Upload the qualification record handoff
        uses: actions/upload-artifact@v4
        with:
          name: beta-qualification-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .qualification-inputs/live-identity.json
            .qualification-inputs/service-release.json
            .qualification-inputs/beta-environment-before.json
            .qualification-inputs/beta-environment-after.json
            .qualification-inputs/smoke-drift.json
            deployment-evidence-before.json
            deployment-evidence.json
            qualification-record.json
            test-results/qualification-report.json
            test-results/beta-environment-verdict.json
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-qualification-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .qualification-inputs/live-identity.json
            .qualification-inputs/service-release.json
            .qualification-inputs/beta-environment-before.json
            .qualification-inputs/beta-environment-after.json
            deployment-evidence-before.json
            deployment-evidence.json
            test-results/qualification-report.json
            test-results/beta-environment-verdict.json
            test-results/**/error-context.md
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-account-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/account-budget.json
            test-results/service-cleanup-operation.json
            test-results/service-cleanup-run.json
          if-no-files-found: ignore

      - name: Upload failed-test screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-failure-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/trace.zip
            test-results/**/worker-profile-binding.json
          retention-days: 7
          if-no-files-found: ignore

  # The deployed smoke diagnostic of the former E2E Integration workflow. It never writes
  # qualification evidence.
  smoke:
    name: Deployed Beta smoke diagnostic
    needs: [preflight, reconcile]
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.operation == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: beta
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      E2E_STAGE: beta
      E2E_OPERATION: ${{ inputs.operation }}
      E2E_EXTERNAL_SERVERS: true
      ENABLE_BETA_MUTATION: ${{ vars.ENABLE_BETA_MUTATION }}
      E2E_CLEANUP_SERVICE_SHA: ${{ vars.E2E_CLEANUP_SERVICE_SHA }}
      BETA_CLEANUP_STATE_MACHINE_VERSION_ARN: ${{ vars.BETA_CLEANUP_STATE_MACHINE_VERSION_ARN }}
      CLEANUP_MACHINE_AUTH_SECRET: ${{ secrets.CLEANUP_MACHINE_AUTH_SECRET }}
      E2E_WORKERS: 2
      E2E_WORKER_SLOT_OFFSET: ${{ inputs.worker_slot_offset }}
      E2E_MAX_ACTIVE_ACCOUNTS: 2
      # One lease per attempt: 2 workers x 3 attempts (initial + two CI retries).
      E2E_MAX_NEW_ACCOUNTS_PER_RUN: 6

    steps:
      - name: Checkout E2E sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile

      - name: Check E2E source
        run: pnpm check

      - name: Require protected execution
        run: node scripts/execution-guard.mjs --source-only

      - name: Verify OIDC identity
        shell: bash
        run: |
          response=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(jq -r '.value' <<< "$response")
          claims=$(node -e \
            "const payload = process.argv[1].split('.')[1]; process.stdout.write(Buffer.from(payload, 'base64url').toString())" \
            "$token")
          actual_subject=$(jq -r '.sub' <<< "$claims")
          expected_subject="repo:git-malu@11473072/AnyWear-E2E@1317091305:environment:beta"
          jq '{iss, aud, sub}' <<< "$claims"
          test "$actual_subject" = "$expected_subject"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/beta-e2e-qualification-role
          role-session-name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify dedicated E2E principal
        shell: bash
        run: |
          identity=$(aws sts get-caller-identity --output json)
          account=$(jq -r '.Account' <<< "$identity")
          principal=$(jq -r '.Arn' <<< "$identity")
          [[ "$account" == 650880818323 ]]
          [[ "$principal" == "arn:aws:sts::650880818323:assumed-role/beta-e2e-qualification-role/e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]
          echo "E2E_AWS_ACCOUNT=$account" >> "$GITHUB_ENV"
          echo "E2E_AWS_PRINCIPAL_ARN=$principal" >> "$GITHUB_ENV"

      # Beta registration admits only the tester allowlist (issue #213), so the smoke
      # operation leases the same stable worker pool the qualification does. Prove every
      # pool address it can lease is listed before the first account exists.
      - name: Require Beta admission eligibility
        run: node scripts/beta-admission-eligibility.mjs

      - name: Observe authenticated deployed tuple before smoke
        env:
          QUALIFICATION_EVIDENCE_PATH: deployment-evidence-before.json
        run: pnpm qualification:collect

      # The live tuple this smoke run actually exercised. The retired pin printout named the
      # reviewed Client and Service commits; the smoke run no longer checks those revisions
      # out, so it states its own source and the live identity it observed instead (#180).
      - name: Record tested revisions
        shell: bash
        run: |
          {
            echo "E2E $(git rev-parse HEAD)"
            echo "Client $(jq -r '.client.source_commit' deployment-evidence-before.json)"
            echo "Service $(jq -r '.service.service_commit' deployment-evidence-before.json)"
            echo "Image $(jq -r '.service.image_digest' deployment-evidence-before.json)"
            echo "Minimum Client $(jq -r '.service.minimum_client_version' .qualification-inputs/live-identity.json)"
          } | tee tested-revisions.txt

      - name: Load Beta test identity configuration
        shell: bash
        run: |
          pool_id=$(aws ssm get-parameter --name /anywear/beta/cognito_user_pool_id --query Parameter.Value --output text)
          client_id=$(aws ssm get-parameter --name /anywear/beta/cognito_client_id --query Parameter.Value --output text)
          {
            echo "USER_POOL_ID=$pool_id"
            echo "VITE_COGNITO_USER_POOL_ID=$pool_id"
            echo "VITE_COGNITO_CLIENT_ID=$client_id"
            echo "E2E_CLEANUP_SERVICE_IMAGE_DIGEST=$(jq -r '.service.image_digest' deployment-evidence-before.json)"
            echo "E2E_CLEANUP_SERVICE_SOURCE_SHA=$(jq -r '.service.service_commit' deployment-evidence-before.json)"
          } >> "$GITHUB_ENV"

      - name: Set unique cleanup run scope
        shell: bash
        run: |
          run_scope="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 8)"
          echo "E2E_CLEANUP_RUN_SCOPE=$run_scope" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run deployed Beta smoke tests
        id: beta-smoke-suite
        run: |
          node scripts/execution-guard.mjs
          pnpm test:smoke

      - name: Clean up exact Beta worker identities
        if: ${{ always() && steps.beta-smoke-suite.outcome != 'skipped' }}
        run: |
          node scripts/execution-guard.mjs
          pnpm accounts:cleanup-workers

      - name: Preserve Beta smoke failure
        if: ${{ always() && steps.beta-smoke-suite.outcome == 'failure' }}
        run: exit 1

      - name: Confirm authenticated deployed tuple remained stable
        env:
          QUALIFICATION_BASELINE_PATH: deployment-evidence-before.json
        run: pnpm qualification:collect

      - name: Upload tested revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-revisions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tested-revisions.txt
            deployment-evidence.json

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-smoke-account-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/account-budget.json
            test-results/service-cleanup-operation.json
            test-results/service-cleanup-run.json
          if-no-files-found: ignore

      - name: Upload failed-test screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-failure-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/trace.zip
            test-results/**/worker-profile-binding.json
          retention-days: 7
          if-no-files-found: ignore

  # The credential-free half of the qualification record: it downloads the `full` job's
  # handoff, re-runs the verifier in a job with no environment and no id-token, and only
  # then attaches the artifact a release consumer reads. It holds no AWS credential and is
  # skipped unless the dispatched operation is `full`; the other two operations can
  # neither produce nor withhold it.
  record:
    name: Validate and attach the qualification record
    needs: [preflight, full]
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.operation == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout E2E verification sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the qualification record handoff
        uses: actions/download-artifact@v4
        with:
          name: beta-qualification-handoff-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify the qualification record without credentials
        run: node scripts/verify-qualification-record.mjs

      # #228: the credential-free half re-proves the drift gate instead of trusting the
      # `full` job's claim: the recorded smoke run/attempt/artifact metadata is re-checked
      # against the live API and the artifact is downloaded and compared again.
      - name: Re-verify the deploy-smoke drift against the recorded artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_DRIFT_BASELINE: deployment-evidence-before.json
        run: node scripts/verify-smoke-drift.mjs --verify-recorded

      - name: Attach the qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: beta-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .qualification-inputs/live-identity.json
            .qualification-inputs/service-release.json
            .qualification-inputs/beta-environment-before.json
            .qualification-inputs/beta-environment-after.json
            .qualification-inputs/smoke-drift.json
            deployment-evidence-before.json
            deployment-evidence.json
            qualification-record.json
            test-results/qualification-report.json
            test-results/beta-environment-verdict.json
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
