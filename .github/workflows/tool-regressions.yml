name: E2E Tool Regressions

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/tool-regressions.yml
      - scripts/beta-runtime-adapter.test.mjs
      - scripts/nonpaid-provider-fixture.test.mjs
      - scripts/nonpaid-runtime-controls.test.mjs
      - scripts/runtime-cloud.test.mjs
      - scripts/runtime-drill.test.mjs
      - scripts/runtime-fixture-drain.test.mjs
      - scripts/runtime-identity-creation.test.mjs
      - scripts/runtime-no-start.test.mjs
      - scripts/runtime-one-shot-runner.test.mjs
      - scripts/runtime-one-shot.test.mjs
      - scripts/runtime-recovery-snapshot.test.mjs
      - scripts/runtime-recovery-snapshots.test.mjs
      - scripts/runtime-recovery.test.mjs
      - scripts/runtime-task-audit.test.mjs
      - scripts/runtime-window-controls.test.mjs
      - scripts/sse-replica-attribution.test.mjs
      - scripts/beta-runtime-adapter.mjs
      - scripts/nonpaid-*.mjs
      - scripts/runtime-*.mjs
      - scripts/sse-replica-attribution.mjs
      - scripts/fixtures/runtime-*.mjs
      - scripts/fixtures/runtime-checkpoint-helper.sh
      - scripts/provider-failure-nonpaid.json
      - tests/fixtures/dummy.png
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/tool-regressions.yml
      - scripts/beta-runtime-adapter.test.mjs
      - scripts/nonpaid-provider-fixture.test.mjs
      - scripts/nonpaid-runtime-controls.test.mjs
      - scripts/runtime-cloud.test.mjs
      - scripts/runtime-drill.test.mjs
      - scripts/runtime-fixture-drain.test.mjs
      - scripts/runtime-identity-creation.test.mjs
      - scripts/runtime-no-start.test.mjs
      - scripts/runtime-one-shot-runner.test.mjs
      - scripts/runtime-one-shot.test.mjs
      - scripts/runtime-recovery-snapshot.test.mjs
      - scripts/runtime-recovery-snapshots.test.mjs
      - scripts/runtime-recovery.test.mjs
      - scripts/runtime-task-audit.test.mjs
      - scripts/runtime-window-controls.test.mjs
      - scripts/sse-replica-attribution.test.mjs
      - scripts/beta-runtime-adapter.mjs
      - scripts/nonpaid-*.mjs
      - scripts/runtime-*.mjs
      - scripts/sse-replica-attribution.mjs
      - scripts/fixtures/runtime-*.mjs
      - scripts/fixtures/runtime-checkpoint-helper.sh
      - scripts/provider-failure-nonpaid.json
      - tests/fixtures/dummy.png
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-regressions:
    name: Credential-free tool regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run explicit tool regressions
        run: pnpm test:tool-regressions
