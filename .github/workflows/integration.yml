name: E2E Integration

on:
  workflow_dispatch:
    inputs:
      worker_slot_offset:
        description: First of two captured worker slots (0 through 6; choose an unused pair)
        required: false
        default: 0
        type: number

permissions:
  contents: read

concurrency:
  group: beta-e2e-account-pool
  cancel-in-progress: false

jobs:
  e2e:
    name: Reviewed revisions on deployed Beta
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: beta
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      E2E_STAGE: beta
      E2E_EXTERNAL_SERVERS: true
      E2E_CLIENT_URL: ${{ vars.BETA_CLIENT_URL }}
      E2E_SERVICE_URL: ${{ vars.BETA_SERVICE_URL }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENABLE_INFRA_E2E: ${{ vars.ENABLE_INFRA_E2E }}
      E2E_CLEANUP_SERVICE_SHA: ${{ vars.E2E_CLEANUP_SERVICE_SHA }}
      BETA_CLEANUP_STATE_MACHINE_VERSION_ARN: ${{ vars.BETA_CLEANUP_STATE_MACHINE_VERSION_ARN }}
      CLEANUP_MACHINE_AUTH_SECRET: ${{ secrets.CLEANUP_MACHINE_AUTH_SECRET }}
      E2E_WORKERS: 2
      E2E_WORKER_SLOT_OFFSET: ${{ inputs.worker_slot_offset }}
      E2E_MAX_ACTIVE_ACCOUNTS: 2
      # One lease per attempt: 2 workers x 3 attempts (initial + two CI retries).
      E2E_MAX_NEW_ACCOUNTS_PER_RUN: 6
      E2E_MAX_QUARANTINED_ACCOUNTS: 2

    steps:
      - name: Checkout E2E sources
        uses: actions/checkout@v4
        with:
          path: AnyWear-E2E
          persist-credentials: false

      - name: Check native release verification CLI
        working-directory: AnyWear-E2E
        run: |
          gh --version | tee github-cli-version.txt
          gh release verify --help --format json > /dev/null
          gh release verify-asset --help --format json > /dev/null

      - name: Generate source checkout token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            AnyWear-Client
            AnyWear-Service
            AnyWear-Service-API
          permission-contents: read

      - name: Generate Infra evidence read token
        id: infra-evidence-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AnyWear-Infra
          permission-contents: read
          permission-actions: read

      - name: Generate Service artifact read token
        id: service-artifact-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AnyWear-Service
          permission-contents: read
          permission-actions: read
          permission-attestations: read

      - name: Load pinned compatibility set
        id: compatibility
        shell: bash
        run: |
          node AnyWear-E2E/scripts/check-compatibility.mjs --require-infra
          node AnyWear-E2E/scripts/execution-guard.mjs --source-only
          {
            echo "client_repository=$(jq -r '.client.repository' AnyWear-E2E/compatibility.json)"
            echo "client_sha=$(jq -r '.client.sha' AnyWear-E2E/compatibility.json)"
            echo "service_repository=$(jq -r '.service.repository' AnyWear-E2E/compatibility.json)"
            echo "service_sha=$(jq -r '.service.sha' AnyWear-E2E/compatibility.json)"
            echo "infra_sha=$(jq -r '.infra.sha' AnyWear-E2E/compatibility.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Client
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.compatibility.outputs.client_repository }}
          ref: ${{ steps.compatibility.outputs.client_sha }}
          path: AnyWear-Client
          submodules: recursive
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Checkout pinned Service
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.compatibility.outputs.service_repository }}
          ref: ${{ steps.compatibility.outputs.service_sha }}
          path: AnyWear-Service
          submodules: recursive
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Record tested revisions
        shell: bash
        run: |
          {
            echo "E2E $(git -C AnyWear-E2E rev-parse HEAD)"
            echo "Client $(git -C AnyWear-Client rev-parse HEAD)"
            git -C AnyWear-Client submodule status --recursive
            echo "Service $(git -C AnyWear-Service rev-parse HEAD)"
            git -C AnyWear-Service submodule status --recursive
          } | tee tested-revisions.txt

      - name: Checkout exact reviewed Infra observation tools
        uses: actions/checkout@v4
        with:
          repository: git-malu/AnyWear-Infra
          ref: ${{ steps.compatibility.outputs.infra_sha }}
          path: AnyWear-E2E/.infra-source
          token: ${{ steps.infra-evidence-token.outputs.token }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: AnyWear-E2E/pnpm-lock.yaml

      - name: Install E2E dependencies
        working-directory: AnyWear-E2E
        run: pnpm install --frozen-lockfile

      - name: Check E2E source
        working-directory: AnyWear-E2E
        run: pnpm check

      - name: Verify trusted deployment and immutable Service inputs
        working-directory: AnyWear-E2E
        env:
          GH_TOKEN: ${{ steps.infra-evidence-token.outputs.token }}
          SERVICE_ARTIFACT_READ_TOKEN: ${{ steps.service-artifact-token.outputs.token }}
        run: node scripts/trusted-deployment-inputs.mjs

      - name: Verify OIDC identity
        shell: bash
        run: |
          response=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(jq -r '.value' <<< "$response")
          claims=$(node -e \
            "const payload = process.argv[1].split('.')[1]; process.stdout.write(Buffer.from(payload, 'base64url').toString())" \
            "$token")
          actual_subject=$(jq -r '.sub' <<< "$claims")
          expected_subject="repo:git-malu@11473072/AnyWear-E2E@1317091305:environment:beta"
          jq '{iss, aud, sub}' <<< "$claims"
          test "$actual_subject" = "$expected_subject"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/beta-e2e-qualification-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify dedicated E2E principal
        working-directory: AnyWear-E2E
        shell: bash
        run: |
          identity=$(aws sts get-caller-identity --output json)
          account=$(jq -r '.Account' <<< "$identity")
          principal=$(jq -r '.Arn' <<< "$identity")
          [[ "$account" == 650880818323 ]]
          [[ "$principal" =~ ^arn:aws:sts::650880818323:assumed-role/beta-e2e-qualification-role/[A-Za-z0-9+=,.@_-]{1,64}$ ]]
          echo "E2E_AWS_ACCOUNT=$account" >> "$GITHUB_ENV"
          echo "E2E_AWS_PRINCIPAL_ARN=$principal" >> "$GITHUB_ENV"

      - name: Observe authenticated deployed tuple before smoke
        working-directory: AnyWear-E2E
        env:
          SERVICE_ARTIFACT_READ_TOKEN: ${{ steps.service-artifact-token.outputs.token }}
          QUALIFICATION_EVIDENCE_PATH: deployment-evidence-before.json
        run: pnpm qualification:collect

      - name: Load Beta test identity configuration
        shell: bash
        run: |
          pool_id=$(aws ssm get-parameter --name /anywear/beta/cognito_user_pool_id --query Parameter.Value --output text)
          client_id=$(aws ssm get-parameter --name /anywear/beta/cognito_client_id --query Parameter.Value --output text)
          {
            echo "USER_POOL_ID=$pool_id"
            echo "VITE_COGNITO_USER_POOL_ID=$pool_id"
            echo "VITE_COGNITO_CLIENT_ID=$client_id"
          } >> "$GITHUB_ENV"
          echo "E2E_CLEANUP_SERVICE_IMAGE_DIGEST=$(jq -r '.service.image_digest' AnyWear-E2E/deployment-evidence-before.json)" >> "$GITHUB_ENV"
          echo "E2E_CLEANUP_SERVICE_SOURCE_SHA=$(jq -r '.service.source_commit' AnyWear-E2E/deployment-evidence-before.json)" >> "$GITHUB_ENV"

      - name: Set unique cleanup run scope
        shell: bash
        run: |
          run_scope="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 8)"
          echo "E2E_CLEANUP_RUN_SCOPE=$run_scope" >> "$GITHUB_ENV"

      - name: Install Chromium
        working-directory: AnyWear-E2E
        run: pnpm exec playwright install chromium --with-deps

      - name: Run deployed Beta smoke tests
        id: beta-suite
        working-directory: AnyWear-E2E
        run: |
          node scripts/execution-guard.mjs
          pnpm test:smoke

      - name: Clean up exact Beta worker identities
        if: ${{ always() && steps.beta-suite.outcome != 'skipped' }}
        working-directory: AnyWear-E2E
        run: |
          node scripts/execution-guard.mjs
          pnpm accounts:cleanup-workers

      - name: Preserve Beta smoke failure
        if: ${{ always() && steps.beta-suite.outcome == 'failure' }}
        run: exit 1

      - name: Confirm authenticated deployed tuple remained stable
        working-directory: AnyWear-E2E
        env:
          SERVICE_ARTIFACT_READ_TOKEN: ${{ steps.service-artifact-token.outputs.token }}
          QUALIFICATION_BASELINE_PATH: deployment-evidence-before.json
        run: pnpm qualification:collect

      - name: Upload tested revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-revisions
          path: |
            tested-revisions.txt
            AnyWear-E2E/github-cli-version.txt
            AnyWear-E2E/deployment-evidence.json

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-account-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            AnyWear-E2E/test-results/account-budget.json
            AnyWear-E2E/test-results/service-cleanup-operation.json
            AnyWear-E2E/test-results/service-cleanup-run.json
          if-no-files-found: ignore

      - name: Upload failed-test screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-failure-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            AnyWear-E2E/test-results/**/test-failed-*.png
            AnyWear-E2E/test-results/**/trace.zip
            AnyWear-E2E/test-results/**/worker-profile-binding.json
          retention-days: 7
          if-no-files-found: ignore
