name: Beta Account Reconcile Schedule

# #217: the daily dispatch that resolves E2E leftovers inside their 24-hour bound.
#
# The reconcile operation cannot run from a `schedule` event: `scripts/execution-guard.mjs`
# requires `workflow_dispatch` and the exact protected `beta-qualification.yml` workflow ref,
# so a scheduled run of this file would fail closed. This entry therefore dispatches
# `operation=reconcile` through the protected `qualify` workflow_dispatch surface with
# `trigger=scheduled`, and the dispatched run is the one that holds the account-pool
# concurrency group and the Beta credentials.
#
# It dispatches only; it holds no AWS credential and resolves no environment-scoped value.
on:
  schedule:
    # Daily at 03:17 UTC. The exact minute is arbitrary; the work is idempotent by address
    # and serialized by the qualify entry's own `beta-e2e-account-pool` concurrency group.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: beta-account-reconcile-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch the daily account reconcile
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # `gh workflow run` needs write access to Actions. Nothing else is read or written.
      actions: write
      contents: read
    steps:
      - name: Dispatch operation=reconcile through the protected qualify entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCHED_BY: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh workflow run beta-qualification.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f operation=reconcile \
            -f trigger=scheduled \
            -f dispatched_by="$DISPATCHED_BY"
